; Local PHP 8.4 settings for the Nestle China HR portal.

opcache.enable=1
opcache.enable_cli=1
opcache.interned_strings_buffer=8
opcache.memory_consumption=128
opcache.max_accelerated_files=4000
opcache.revalidate_freq=60
opcache.save_comments=1

upload_max_filesize=50M
post_max_size=50M
memory_limit=512M
expose_php=off
display_errors=Off
display_startup_errors=Off
log_errors=On
; CLI PHP must not log to syslog on this host. /dev/log is served by the
; container's rsyslogd, which cannot start its threads here (the host's seccomp
; profile blocks clone3), so nothing drains the socket and a blocking send(2)
; hangs the process forever -- this is why `docker exec <c> drush` printed
; nothing and never returned. stderr still reaches tdk-syslog through the
; container's syslog log driver, so nothing is lost. php-fpm is unaffected: the
; host's www.conf pins php_admin_value[error_log] = /proc/self/fd/2, which
; outranks any php.ini file.
error_log=/proc/self/fd/2
error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
